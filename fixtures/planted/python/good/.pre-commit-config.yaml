repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 8e5e7e5ab8b370d6c329ec480221332ada57f0ab  # frozen: v0.7.2
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "8e5e7e5ab8b370d6c329ec480221332ada57f0ab"  # frozen: v5.0.0
    hooks:
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
