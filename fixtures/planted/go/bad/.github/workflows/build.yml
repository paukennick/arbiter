name: build
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    container: golang:1.22 # expect: arbiter/supply.unpinned-container-image
    services:
      postgres:
        image: postgres # expect: arbiter/supply.unpinned-container-image
    steps:
      - uses: "actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab"
      - uses: 'actions/setup-go@8e5e7e5ab8b370d6c329ec480221332ada57f0ab'
      - uses: docker://alpine@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - uses: docker://alpine:3.20 # expect: arbiter/supply.unpinned-container-image
      - run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest # expect: arbiter/supply.unpinned-install-in-build
          curl -sSfL https://example.com/install.sh | bash # expect: arbiter/supply.remote-script-piped
          go test ./...
