      postgres:
        image: postgres:16.4@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: "actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab"
