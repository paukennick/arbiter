# Scan the development slice of a breadth set on GitHub's runners (ARB-177),
# so the laptop keeps its memory for labelling. Development repositories only:
# the job refuses any slice but `dev`, because held-out scans stay on the
# laptop (their reports are measurement data and are never tuned against).
# Each shard is one job; reports come back as workflow artifacts.

name: scan-dev

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Breadth manifest, e.g. tools/gold/breadth-r7-python-repos.json"
        required: true
      shards:
        description: "Number of parallel jobs (1-20)"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          n="${{ inputs.shards }}"
          case "$n" in ''|*[!0-9]*) echo "shards must be a number"; exit 1;; esac
          [ "$n" -ge 1 ] && [ "$n" -le 20 ] || { echo "shards must be 1-20"; exit 1; }
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ast,api]
          python -c "import json, tree_sitter_language_pack as t; t.download(json.load(open('src/arbiter/tooling.json'))['tree_sitter']['default_grammars'])"
          ./tools/install_tools.sh
          arbiter tools install .

      - name: Write the shard's fetch script (dev slice only)
        env:
          MANIFEST: ${{ inputs.manifest }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: |
          case "$MANIFEST" in tools/gold/breadth-r7-*-repos.json) ;; *) echo "not a breadth manifest"; exit 1;; esac
          python - <<'EOF'
          import json, os
          m = json.load(open(os.environ["MANIFEST"], encoding="utf-8"))
          i, n = int(os.environ["SHARD"]), int(os.environ["SHARDS"])
          rows = [(k, r) for k, r in sorted(m["repos"].items()) if r["slice"] == "dev"]
          src = open("tools/fetch_heldout_r7_python.sh", encoding="utf-8").read()
          head = src[: src.index("get_pinned py-")]
          lang = os.environ["MANIFEST"].split("breadth-r7-")[1].split("-repos")[0]
          lines = [f"get_pinned {k} {r['url']} {r['sha']} {lang}" for j, (k, r) in enumerate(rows) if j % n == i]
          open("shard-fetch.sh", "w", encoding="utf-8").write(head + "\n".join(lines) + "\n")
          print(len(lines), "dev repositories in this shard")
          EOF

      - name: Fetch and scan
        run: |
          bash shard-fetch.sh "$RUNNER_TEMP/corpus"
          python tools/gold_benchmark.py --corpus "$RUNNER_TEMP/corpus" --fetch-script shard-fetch.sh \
            --out scan-out --jobs 2 --raw --no-fail --allow-missing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-dev-shard-${{ matrix.shard }}
          path: scan-out/
          retention-days: 14
